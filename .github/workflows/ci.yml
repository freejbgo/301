name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dev-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/redi-multi/go.mod
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: ripgrep (verify-admin-i18n-invariants)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Dev preflight (发版终验)
        env:
          VERIFY_REDI_REQUIRE_DOCKER: "1"
        run: bash scripts/dev-preflight.sh

  master-phpunit-php80:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          tools: composer:v2
      - name: Install dependencies
        working-directory: master/master
        run: composer install --no-interaction --prefer-dist
      - name: PHPUnit (PHP 8.0 lock)
        working-directory: master/master
        run: ./vendor/bin/phpunit --testsuite Unit,Feature

  centos7-integration:
    runs-on: ubuntu-latest
    needs: [dev-preflight, master-phpunit-php80]
    if: always() && needs.dev-preflight.result == 'success' && needs.master-phpunit-php80.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/redi-multi/go.mod
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: Build ephemeral release tarballs for smoke only
        run: |
          ./scripts/build-node-tar.sh
          cd master/master
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          cd ../..
          ./scripts/build-master-tar.sh
          test -s master/master.tar.gz && test -s node/redi-multi.tar.gz
      - name: CentOS 7 container smoke
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo centos:7 bash scripts/centos7/container-integration-test.sh
