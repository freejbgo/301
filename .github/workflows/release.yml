name: Publish release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/redi-multi/go.mod
      - name: Vet and test node
        working-directory: node/redi-multi
        run: |
          go vet ./...
          go test ./...

  master-phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: Install dependencies
        working-directory: master/master
        run: composer install --no-interaction --prefer-dist
      - name: Composer audit
        working-directory: master/master
        run: composer audit --no-interaction
      - name: PHPUnit
        working-directory: master/master
        run: ./vendor/bin/phpunit --testsuite Unit,Feature

  master-phpunit-php80:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          tools: composer:v2
      - name: Install dependencies
        working-directory: master/master
        run: composer install --no-interaction --prefer-dist
      - name: PHPUnit (PHP 8.0 lock)
        working-directory: master/master
        run: ./vendor/bin/phpunit --testsuite Unit,Feature

  centos7-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy script syntax (CentOS 7)
        run: |
          for f in scripts/dev-preflight.sh scripts/ensure-release-tarballs.sh scripts/verify-redi-db-deploy-path.sh scripts/verify-master-cron-templates.sh scripts/verify-node-deploy-templates.sh scripts/verify-grant-nodes-templates.sh scripts/verify-acceptance-centos7-doc.sh scripts/verify-redi-artisan-cron.sh scripts/verify-masteragent-invariants.sh scripts/verify-acme-code-invariants.sh scripts/verify-renew-ops-invariants.sh scripts/verify-acme-prune-requeue-invariants.sh scripts/verify-edge-dns-invariants.sh scripts/verify-cname-cert-job-invariants.sh scripts/verify-dns-providers-invariants.sh scripts/verify-node-skip-api-invariants.sh scripts/verify-node-api-js-invariants.sh scripts/verify-redirect-platform-invariants.sh scripts/verify-acceptance-edge-pool-doc.sh scripts/verify-tenant-edge-queue-invariants.sh scripts/verify-health-tenant-invariants.sh scripts/verify-cert-deploy-invariants.sh scripts/verify-production-readiness-doc.sh scripts/verify-admin-api-invariants.sh scripts/verify-release-workflow-invariants.sh scripts/verify-ci-preflight-parity.sh scripts/build-master-tar.sh scripts/build-node-tar.sh scripts/patch-master-cron-ops-webhook.sh scripts/centos7/*.sh; do bash -n "$f" || exit 1; done
          python3 scripts/centos7/lagran_ports.py node/redi-multi/config.json.example | grep -q '80'
          bash scripts/verify-master-cron-templates.sh
          bash scripts/verify-node-deploy-templates.sh
          bash scripts/verify-grant-nodes-templates.sh
          bash scripts/verify-acceptance-centos7-doc.sh
          bash scripts/verify-edge-dns-invariants.sh
          bash scripts/verify-acceptance-edge-pool-doc.sh
          bash scripts/verify-tenant-edge-queue-invariants.sh
          bash scripts/verify-cert-deploy-invariants.sh
          bash scripts/verify-production-readiness-doc.sh
          bash scripts/verify-masteragent-invariants.sh
          bash scripts/verify-renew-ops-invariants.sh
          bash scripts/verify-acme-prune-requeue-invariants.sh
          bash scripts/verify-health-tenant-invariants.sh
          bash scripts/verify-cname-cert-job-invariants.sh
          bash scripts/verify-dns-providers-invariants.sh
          bash scripts/verify-node-skip-api-invariants.sh
          bash scripts/verify-node-api-js-invariants.sh
          bash scripts/verify-redirect-platform-invariants.sh
          bash scripts/verify-admin-api-invariants.sh
          bash scripts/verify-release-workflow-invariants.sh
          bash scripts/verify-ci-preflight-parity.sh
          php scripts/verify-redi-node-procedure-sync.php
          bash scripts/verify-redi-db-deploy-path.sh

  centos7-integration:
    runs-on: ubuntu-latest
    needs: [node, master-phpunit, master-phpunit-php80, centos7-scripts]
    if: always() && needs.node.result == 'success' && needs.master-phpunit.result == 'success' && needs.master-phpunit-php80.result == 'success' && needs.centos7-scripts.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/redi-multi/go.mod
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: Build ephemeral release tarballs for smoke only
        run: |
          ./scripts/build-node-tar.sh
          cd master/master
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          cd ../..
          ./scripts/build-master-tar.sh
          test -s master/master.tar.gz && test -s node/redi-multi.tar.gz
      - name: CentOS 7 container smoke
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo centos:7 bash scripts/centos7/container-integration-test.sh

  publish:
    runs-on: ubuntu-latest
    needs: [node, master-phpunit, master-phpunit-php80, centos7-scripts, centos7-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: node/redi-multi/go.mod

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Build release packages
        run: |
          ./scripts/build-node-tar.sh
          cd master/master
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          cd ../..
          ./scripts/build-master-tar.sh

      - name: Check packages
        run: |
          test -s master/master.tar.gz
          test -s node/redi-multi.tar.gz
          tar tzf master/master.tar.gz | grep -q '^master/vendor/autoload.php$'
          tar tzf node/redi-multi.tar.gz | grep -q '^redi-multi/bin/redi-multi$'

      - name: Verify built master tree (audit + PHPUnit)
        working-directory: master/master
        run: |
          composer install --no-interaction --prefer-dist
          composer audit --no-interaction
          ./vendor/bin/phpunit --testsuite Unit,Feature

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "master/master.tar.gz#master.tar.gz" \
            "node/redi-multi.tar.gz#redi-multi.tar.gz" \
            --title "CentOS 7 主控与节点 ${GITHUB_REF_NAME}" \
            --notes "主控包 master.tar.gz（含 vendor，不含 .env）。节点包 redi-multi.tar.gz（CentOS 7 静态二进制）。部署步骤见仓库 DEPLOY-centos7.md。本 Release 在发布前已通过与 CI 相同的测试、composer audit 与 CentOS 7 冒烟。"
