name: Publish release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: node/redi-multi/go.mod

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Build release packages
        run: |
          ./scripts/build-node-tar.sh
          cd master/master
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          cd ../..
          ./scripts/build-master-tar.sh

      - name: Check packages
        run: |
          test -s master/master.tar.gz
          test -s node/redi-multi.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "master/master.tar.gz#master.tar.gz" \
            "node/redi-multi.tar.gz#redi-multi.tar.gz" \
            --title "CentOS 7 主控与节点 ${GITHUB_REF_NAME}" \
            --notes "主控包 master.tar.gz（含 vendor，不含 .env）。节点包 redi-multi.tar.gz（CentOS 7 静态二进制）。部署步骤见仓库 DEPLOY-centos7.md。"
